name: test
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node scripts/check-workflows.mjs

  # Not required to merge: it says what a merge will not deploy by itself.
  deploy-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes a merge does not deploy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$changed" | grep -q '^\.github/'; then
            echo "::warning::This PR changes GitHub Actions workflows. Read them closely before merging."
          fi
          if echo "$changed" | grep -qE '^(cdk|ops)/'; then
            echo "::error::This PR changes cdk/ or ops/. After merging, deploy from a computer with npm run deploy; the automatic deploy waits until then."
            exit 1
          fi
