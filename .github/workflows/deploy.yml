name: deploy
# Deploys lambda/ after a merge to main, once Eric approves the production
# environment. cdk/ and ops/ are deployed from a computer with npm run deploy.
on:
  push:
    branches: [main]
    paths: ['lambda/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # No npm install here: this job holds AWS credentials, and lambda/ has no
  # dependencies of its own.
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      FUNCTION: animitta
      MARKER: /animitta/deployed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A re-run of an old run would otherwise deploy an old commit.
      - name: Deploy only the newest main
        run: |
          git fetch --quiet origin main
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::error::$GITHUB_SHA is no longer the newest main. Run the deploy for the newest instead."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Check cdk/ and ops/ are live as they are on main
        id: live
        run: |
          aws ssm get-parameter --name "$MARKER" --query Parameter.Value --output text > marker.json
          here="$(git rev-parse HEAD:cdk) $(git rev-parse HEAD:ops)"
          if [ "$(jq -r .infraTree marker.json)" != "$here" ]; then
            echo "::error::cdk/ or ops/ changed since the last npm run deploy. Deploy from a computer with npm run deploy, which deploys lambda/ too."
            exit 1
          fi
          echo "commit=$(jq -r .commit marker.json)" >> "$GITHUB_OUTPUT"

      - name: Package this commit and the one live now
        env:
          LIVE: ${{ steps.live.outputs.commit }}
        run: |
          (cd lambda && zip -qrX ../new.zip .)
          mkdir previous
          git archive "$LIVE" lambda | tar -x -C previous
          (cd previous/lambda && zip -qrX ../../previous.zip .)

      - name: Deploy
        id: deploy
        run: |
          held=$(aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://new.zip --query CodeSha256 --output text)
          aws lambda wait function-updated --function-name "$FUNCTION" > /dev/null
          if [ "$held" != "$(openssl dgst -sha256 -binary new.zip | base64)" ]; then
            echo "::error::The code Lambda holds is not this commit's."
            exit 1
          fi

      - name: Self-test and an unsigned webhook request
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
        run: |
          aws lambda invoke --function-name "$FUNCTION" --cli-binary-format raw-in-base64-out --payload '{"selfTest":true}' self-test.json --query StatusCode --output text > /dev/null
          result=$(jq -r .body self-test.json)
          echo "Self-test: $result"
          echo "$result" | jq -e '.anthropic == "ok" and .signature == "ok" and (.bedrock == "ok" or .bedrock == "off")' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"events":[]}' "$WEBHOOK_URL")
          if [ "$code" != 401 ]; then
            echo "::error::An unsigned webhook request got $code, not 401."
            exit 1
          fi

      - name: Record what runs
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg tree "$(git rev-parse HEAD:cdk) $(git rev-parse HEAD:ops)" --arg at "$(date -u +%FT%TZ)" \
            '{commit: $commit, infraTree: $tree, at: $at, by: "github actions"}' > marker.json
          aws ssm put-parameter --name "$MARKER" --type String --overwrite --value file://marker.json --query Version --output text > /dev/null

      - name: Roll back to the code that was live
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          LIVE: ${{ steps.live.outputs.commit }}
          ALERT_TOPIC_ARN: ${{ vars.ALERT_TOPIC_ARN }}
        run: |
          held=$(aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://previous.zip --query CodeSha256 --output text)
          aws lambda wait function-updated --function-name "$FUNCTION" > /dev/null
          if [ "$held" = "$(openssl dgst -sha256 -binary previous.zip | base64)" ]; then
            outcome="已經退回 ${LIVE:0:7}，線上恢復原本那一版。main 上有 ${GITHUB_SHA:0:7} 但線上沒有：請 revert 或修好再 merge。"
          else
            outcome="退回 ${LIVE:0:7} 也失敗了，線上的程式碼不確定是哪一版，請馬上看。"
          fi
          message="無相界部署 ${GITHUB_SHA:0:7} 沒有通過上線後的檢查。${outcome} 紀錄：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          aws sns publish --topic-arn "$ALERT_TOPIC_ARN" --subject "[animitta] deploy rolled back" --message "$message" --query MessageId --output text > /dev/null
